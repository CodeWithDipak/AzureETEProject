# The main pipeline for AzureProjectDB

resources:
  pipelines:
    AzureProjectDB_etl:
      name: AzureProjectDB_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/AzureProjectDB_etl"

      libraries:
        - glob:
            include: ../src/AzureProjectDB_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
